[package]
name = "little-proxy"
version = "1.2.0"
edition = "2021"
description = "Заворачивает TCP-трафик выбранных процессов Windows в SOCKS5/HTTP-прокси"
license = "MIT"

[dependencies]
native-tls = "0.2.18"
regex-lite = "0.1.9"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Паника в любом потоке завершает процесс: ОС закрывает хэндлы WinDivert, и сеть не остаётся
# «повешенной» на мёртвом потоке перехвата.
panic = "abort"
strip = true

[[bin]]
name = "little-proxy"
path = "src/main.rs"
# Бинарник с манифестом requireAdministrator; тесты живут в lib.
test = false
